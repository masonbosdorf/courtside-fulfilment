name: fulfilment-sync

# Cloud data refresh — runs the node fetchers in GitHub's infrastructure (no laptop).
# Triggered every 5 min by cron-job.org hitting the workflow_dispatch API (reliable).
# GitHub's own `schedule:` was REMOVED — it's unreliable AND it double-fired alongside
# cron-job.org, racing on the git push and producing spurious "Scheduled failed" emails.

on:
  workflow_dispatch: {}        # fired every 5 min by cron-job.org + the manual "Run workflow" button

permissions:
  contents: write              # allow committing the refreshed seed back

concurrency:
  group: fulfilment-sync       # never overlap runs
  cancel-in-progress: true     # a stuck/zombie run must never block the group — the next dispatch replaces it (17h stall on 2026-09-13)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12          # runs take ~1–3 min; anything longer is hung
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compute Melbourne dates
        run: node gh-compute-dates.js >> "$GITHUB_ENV"

      - name: Reset today's metrics if it's a new Melbourne day
        run: node reset-today-if-newday.js "$GITHUB_WORKSPACE/fulfilment-seed.js"

      - name: Shopify fetch
        id: shopify
        continue-on-error: true
        env:
          FS_SHOPIFY_DOMAIN:        ${{ secrets.FS_SHOPIFY_DOMAIN }}
          FS_SHOPIFY_CLIENT_ID:     ${{ secrets.FS_SHOPIFY_CLIENT_ID }}
          FS_SHOPIFY_CLIENT_SECRET: ${{ secrets.FS_SHOPIFY_CLIENT_SECRET }}
        run: node shopify-fetch.js "$GITHUB_WORKSPACE/fulfilment-seed.js" "$TODAY_ISO" "$LW_ISO" "$NOW_HM" "$SHOP_OFFSET"

      - name: NetSuite fetch
        id: netsuite
        continue-on-error: true
        env:
          FS_ACCOUNT:         ${{ secrets.FS_ACCOUNT }}
          FS_CONSUMER_KEY:    ${{ secrets.FS_CONSUMER_KEY }}
          FS_CONSUMER_SECRET: ${{ secrets.FS_CONSUMER_SECRET }}
          FS_TOKEN_ID:        ${{ secrets.FS_TOKEN_ID }}
          FS_TOKEN_SECRET:    ${{ secrets.FS_TOKEN_SECRET }}
          UNFULFILLED_LIVE:   ${{ steps.shopify.outcome == 'success' && '1' || '0' }}
        run: node netsuite-fetch.js "$GITHUB_WORKSPACE/fulfilment-seed.js" /tmp/unf_orders.json "$TODAY_NS" "$MONTH_START_NS" "$LW_NS" "$NOW_HM" "$WEEK_START_NS"

      - name: Fail if BOTH fetchers failed
        if: steps.shopify.outcome != 'success' && steps.netsuite.outcome != 'success'
        run: echo "both Shopify and NetSuite failed" && exit 1

      # Pick Waves: build the ENCRYPTED pick pool (orders + addresses + Loc 2 bins) and write the
      # no-PII wave progress into seed.waves. Never allowed to break the kiosk data.
      - name: Pick pool (Pick Waves)
        id: pickpool
        continue-on-error: true
        env:
          FS_PICK_KEY:              ${{ secrets.FS_PICK_KEY }}
          FS_SHOPIFY_DOMAIN:        ${{ secrets.FS_SHOPIFY_DOMAIN }}
          FS_SHOPIFY_CLIENT_ID:     ${{ secrets.FS_SHOPIFY_CLIENT_ID }}
          FS_SHOPIFY_CLIENT_SECRET: ${{ secrets.FS_SHOPIFY_CLIENT_SECRET }}
          FS_ACCOUNT:               ${{ secrets.FS_ACCOUNT }}
          FS_CONSUMER_KEY:          ${{ secrets.FS_CONSUMER_KEY }}
          FS_CONSUMER_SECRET:       ${{ secrets.FS_CONSUMER_SECRET }}
          FS_TOKEN_ID:              ${{ secrets.FS_TOKEN_ID }}
          FS_TOKEN_SECRET:          ${{ secrets.FS_TOKEN_SECRET }}
        run: |
          IDX="$RUNNER_TEMP/waves-index.json"
          if git fetch -q --depth 1 origin waves && git show FETCH_HEAD:waves/index.json > "$IDX"; then
            echo "wave register: $(wc -c < "$IDX") bytes"
          else
            echo '{"v":1,"waves":[]}' > "$IDX"; echo "no wave register yet"
          fi
          node pick-fetch.js "$RUNNER_TEMP/pick-pool.enc" --waves "$IDX" --seed "$GITHUB_WORKSPACE/fulfilment-seed.js"

      - name: Stamp asOf (Melbourne)
        run: node gh-stamp-asof.js "$GITHUB_WORKSPACE/fulfilment-seed.js"

      - name: Commit & push if the data changed
        run: |
          git config user.name  "fulfilment-bot"
          git config user.email "fulfilment-bot@users.noreply.github.com"
          git add fulfilment-seed.js
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data $(TZ=Australia/Melbourne date +'%d-%m %H:%M') [cloud]"
            # resilient publish: if another run pushed first, rebase on top and retry (no race failures)
            for i in 1 2 3; do
              git pull --rebase --autostash -q origin main && git push && break
              echo "push race — retrying ($i)"; sleep 2
            done
          fi

      # One orphan commit, force-pushed: the pick-data branch only ever holds the latest pool, so the
      # repo doesn't grow and superseded ciphertext isn't kept in history. Built with plumbing so the
      # main checkout is untouched.
      - name: Publish pick pool (force-push pick-data)
        if: steps.pickpool.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name  "fulfilment-bot"
          git config user.email "fulfilment-bot@users.noreply.github.com"
          printf '%s\n' "# pick-data — encrypted pick pool (do not merge)" "" \
            "Force-pushed by sync.yml (pick-fetch.js) on every run. AES-GCM, key = FS_PICK_KEY." > "$RUNNER_TEMP/pick-data-README.md"
          POOL=$(git hash-object -w "$RUNNER_TEMP/pick-pool.enc")
          README=$(git hash-object -w "$RUNNER_TEMP/pick-data-README.md")
          TREE=$(printf '100644 blob %s\tREADME.md\n100644 blob %s\tpick-pool.enc\n' "$README" "$POOL" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "pool $(TZ=Australia/Melbourne date +'%d-%m %H:%M') [cloud]")
          git push -q --force origin "$COMMIT:refs/heads/pick-data"
          echo "pick-data -> $COMMIT ($(wc -c < "$RUNNER_TEMP/pick-pool.enc") bytes encrypted)"
